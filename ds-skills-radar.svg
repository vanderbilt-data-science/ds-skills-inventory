<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<!--
  Data Scientist Skills Inventory (2026) - editable radar
  HOW TO EDIT:
  * Skill values: edit the single <polygon id="profile"> points list below.
    Each vertex i sits at radius value/4 * 280 from center (520,440), angle
    -90deg + i*(360/9)deg clockwise, in the axis order listed in <g id="axes">.
    Easiest: regenerate with make_svg.py after changing values there.
  * Labels: plain <text> elements in <g id="labels">.
  * Colors: search-and-replace the hex values; cluster arcs use
    #2a78d6 / #eb6834 / #1baf7a / #eda100.
  * Delete <g id="cluster-arcs"> or <g id="new-badges"> if not wanted.
-->
<rect width="1360" height="960" fill="#fcfcfb"/>
<g id="title">
<text x="680" y="56" text-anchor="middle" font-size="32" font-weight="700" fill="#0b0b0b">Data Scientist Skills Inventory</text>
<text x="680" y="86" text-anchor="middle" font-size="18" fill="#52514e">2026 revision — 9 axes, scale 0–4</text>
</g>
<g id="rings" fill="none" stroke="#e1e0d9" stroke-width="1">
<circle cx="680" cy="490" r="70"/>
<circle cx="680" cy="490" r="140"/>
<circle cx="680" cy="490" r="210"/>
<circle cx="680" cy="490" r="280" stroke="#c3c2b7"/>
</g>
<g id="ring-labels" font-size="14" fill="#898781" text-anchor="middle">
<text x="694" y="425">1</text>
<text x="694" y="355">2</text>
<text x="694" y="285">3</text>
<text x="694" y="215">4</text>
</g>
<g id="axes" stroke="#e1e0d9" stroke-width="1">
<line x1="680" y1="490" x2="680" y2="210"/><!-- Statistics & Modeling -->
<line x1="680" y1="490" x2="860" y2="275.5"/><!-- AI Foundations -->
<line x1="680" y1="490" x2="955.7" y2="441.4"/><!-- AI Agents & Frameworks -->
<line x1="680" y1="490" x2="922.5" y2="630"/><!-- Programming -->
<line x1="680" y1="490" x2="775.8" y2="753.1"/><!-- Data Engineering -->
<line x1="680" y1="490" x2="584.2" y2="753.1"/><!-- Visualization -->
<line x1="680" y1="490" x2="437.5" y2="630"/><!-- Communication -->
<line x1="680" y1="490" x2="404.3" y2="441.4"/><!-- Storytelling -->
<line x1="680" y1="490" x2="500" y2="275.5"/><!-- Domain Knowledge -->
</g>
<g id="cluster-arcs" fill="none" stroke-width="5" stroke-linecap="round">
<path d="M 602.1 177.6 A 322.0 322.0 0 0 1 757.9 177.6" stroke="#2a78d6"/><!-- Analytical core -->
<path d="M 821.2 200.6 A 322.0 322.0 0 0 1 1001.2 512.5" stroke="#eb6834"/><!-- AI -->
<path d="M 989.5 578.8 A 322.0 322.0 0 0 1 713.7 810.2" stroke="#1baf7a"/><!-- Engineering -->
<path d="M 646.3 810.2 A 322.0 322.0 0 0 1 538.8 200.6" stroke="#eda100"/><!-- Human interface -->
</g>
<g id="cluster-legend" font-size="18">
<circle cx="377.2" cy="920" r="7" fill="#2a78d6"/>
<text x="392.2" y="926" fill="#52514e">Analytical core</text>
<circle cx="576.8" cy="920" r="7" fill="#eb6834"/>
<text x="591.8" y="926" fill="#52514e">AI</text>
<circle cx="639.8" cy="920" r="7" fill="#1baf7a"/>
<text x="654.8" y="926" fill="#52514e">Engineering</text>
<circle cx="797.2" cy="920" r="7" fill="#eda100"/>
<text x="812.2" y="926" fill="#52514e">Human interface</text>
</g>
<!-- profile values: Statistics & Modeling=3, AI Foundations=3, AI Agents & Frameworks=3, Programming=2, Data Engineering=2, Visualization=3, Communication=3, Storytelling=3, Domain Knowledge=2 -->
<polygon id="profile" points="680,280 815,329.1 886.8,453.5 801.2,560 727.9,621.6 608.2,687.3 498.1,595 473.2,453.5 590,382.8" fill="#2a78d6" fill-opacity="0.22" stroke="#2a78d6" stroke-width="2" stroke-linejoin="round"/>
<g id="profile-dots" fill="#2a78d6">
<circle cx="680" cy="280" r="4"/>
<circle cx="815" cy="329.1" r="4"/>
<circle cx="886.8" cy="453.5" r="4"/>
<circle cx="801.2" cy="560" r="4"/>
<circle cx="727.9" cy="621.6" r="4"/>
<circle cx="608.2" cy="687.3" r="4"/>
<circle cx="498.1" cy="595" r="4"/>
<circle cx="473.2" cy="453.5" r="4"/>
<circle cx="590" cy="382.8" r="4"/>
</g>
<g id="labels" font-size="23" font-weight="600" fill="#0b0b0b">
<text x="680" y="132" text-anchor="middle">Statistics &amp; Modeling</text>
<text x="910.1" y="223.8" text-anchor="start">AI Foundations</text>
<text x="1032.6" y="435.8" text-anchor="start">AI Agents &amp; Frameworks</text>
<text x="990" y="677" text-anchor="start">Programming</text>
<text x="802.4" y="846.4" text-anchor="middle">Data Engineering</text>
<text x="557.6" y="846.4" text-anchor="middle">Visualization</text>
<text x="370" y="677" text-anchor="end">Communication</text>
<text x="327.4" y="435.8" text-anchor="end">Storytelling</text>
<text x="449.9" y="223.8" text-anchor="end">Domain Knowledge</text>
</g>
<g id="new-badges">
<rect x="1032.6" y="447.8" width="52" height="24" rx="12" fill="#eb6834" fill-opacity="0.14"/>
<text x="1058.6" y="464.8" text-anchor="middle" font-size="14" font-weight="700" fill="#a63c14">NEW</text>
</g>
</svg>