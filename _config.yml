title: Data Scientist Skills Inventory
description: >-
  A 2026 revision of the data science skills inventory for the AI-agent era —
  nine axes, 0-4 rung ladders, and an interactive radar explorer.
theme: jekyll-theme-primer

# The explorer and team view are hand-written, self-contained pages; Jekyll
# must copy them through untouched rather than try to render them.
include:
  - ds-skills-explorer.html
  - team.html

exclude:
  - make_svg.py
  - LICENSE
  - "*.vtt"
